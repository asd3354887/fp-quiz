<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理財規劃人員 互動題庫</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d1d1f;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--sel:#dbeafe;--bd:#d1d5db}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--fg:#f3f4f6;--mut:#9ca3af;--pri:#3b82f6;--okbg:#14532d;--badbg:#7f1d1d;--sel:#1e3a8a;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:5;padding:8px 12px}
header h1{font-size:18px;margin:4px 0 8px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.links{display:flex;gap:6px;margin-bottom:6px}
.links a{color:var(--pri);text-decoration:none;border:1px solid var(--bd);border-radius:10px;padding:5px 10px;font-size:15px;white-space:nowrap}
nav{display:flex;gap:6px}.tab{flex:1;padding:8px 4px}
main{max-width:760px;margin:0 auto;padding:12px 12px 40px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.on,.primary{background:var(--pri)!important;color:#fff!important;border-color:var(--pri)!important}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card button{margin:4px 6px 4px 0}
.row{display:block;width:100%;text-align:left;margin-bottom:8px;border-radius:14px}
.rt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.rt span{color:var(--mut);font-size:14px}
.pbar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;margin:0}
label{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
input[type=checkbox]{width:18px;height:18px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}header.bar button{white-space:nowrap;flex:none}header.bar span{font-size:15px;color:var(--mut);text-align:center}
.meta{color:var(--mut);font-size:13px;margin-bottom:6px}
.stem{font-size:17px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px;line-height:1.5;word-break:break-word;margin:0!important}
.opt.sel{background:var(--sel);border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{opacity:1}
.exp{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid}
.exp.ok{border-color:var(--ok);background:var(--okbg)}.exp.bad{border-color:var(--bad);background:var(--badbg)}
.exp p{margin:6px 0;word-break:break-word}.res{font-weight:700}.refs{color:var(--mut);font-size:13px}
.nav{display:flex;gap:8px;margin-bottom:12px}.nav button{flex:1;padding:14px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{padding:6px 0;font-size:13px;border-radius:6px;margin:0}
.grid .done{background:var(--sel)}.grid .cur{outline:2px solid var(--pri)}.grid .ok{background:var(--okbg)}.grid .bad{background:var(--badbg)}
.center{text-align:center}.big{font-size:44px;font-weight:800;line-height:1.2}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.warn{border-color:#f59e0b}
.mut{color:var(--mut);font-size:14px}
#timer{font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.fav{font-size:20px;padding:4px 12px;color:#f59e0b}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left}
</style>
</head>

  const chs = [...new Set(DATA.hot.filter(q => q.s === p.s).map(q => q.ch))];
  let h = `<div class="card"><div class="seg">${['tool', 'plan'].map(s =>
    `<button data-act="subj" data-arg="${s}" class="${p.s === s ? 'on' : ''}">${SUBJ[s]}</button>`).join('')}</div>
    <label>星等 <select data-pref="star"><option value="1">高頻題（考過 2 屆以上）</option><option value="2">⭐⭐ 以上</option><option value="3">⭐⭐⭐</option><option value="0">全部題目（含只考過 1 屆）</option></select></label>
    <label>題目 <select data-pref="mode"><option value="all">全部</option><option value="new">只做沒做過</option><option value="weak">沒做過＋上次錯</option></select></label>
    <label><input type="checkbox" data-pref="shuf" ${p.shuf ? 'checked' : ''}> 隨機順序</label>
    <div class="mut">⭐ 越多＝在歷屆考試出現越多次。點章節開始作答，選完立刻看對錯與解析。</div></div>`;
  [''].concat(chs).forEach(ch => {
    const L = hotList(p.s, ch);
    if (!L.length) return;
    const done = L.filter(q => S.rec[q.id]).length;
    const right = L.filter(q => S.rec[q.id] && S.rec[q.id].last).length;
    h += `<button class="row" data-act="start" data-arg="${esc(ch)}"><div class="rt"><b>${ch ? esc(ch) : '全部章節'}</b>
      <span>${L.length} 題 · 做過 ${done} · 上次答對 ${right}</span></div><div class="pbar"><i style="width:${done / L.length * 100}%"></i></div></button>`;
  });
  return h;
}

function mockTab() {
  let h = '';
  if (S.cur) {
    const p = paperFromCur(S.cur);
    h += `<div class="card warn"><b>有未完成的模擬考：${p.name}</b><br><span class="mut">剩餘 ${fmt(S.cur.end - Date.now())}</span><br>
      <button class="primary" data-act="resume">繼續作答</button><button data-act="abandon">放棄</button></div>`;
  }
  h += '<div class="card mut">限時作答、交卷才公布答案；70 分及格（對 35 題）。中途離開會保留進度，但時間照走。答錯與未作答的題目會自動加入錯題本。</div>';
  const rm = k => S.mock[k] ? ` · 最高 ${S.mock[k].best} 分 · 做過 ${S.mock[k].times} 次` : '';
  h += `<div class="card"><b>🎲 隨機模擬考（每次都是新考卷）</b>
    <div class="mut">從第 27–48 屆全部題目抽 50 題：每章題數照正式考試配置；出現越多屆的題目越容易被抽到（出現 6 屆＝機率 6 倍）；同一份考卷不重複；題目照正式考試的出題順序排列。</div>
    <button class="primary" data-act="rstart" data-arg="tool">理財工具（60 分鐘）</button>
    <button class="primary" data-act="rstart" data-arg="plan">規劃實務（90 分鐘）</button>
    <div class="mut">${rm('rand-tool') ? '工具' + rm('rand-tool') : ''}${rm('rand-plan') ? '<br>實務' + rm('rand-plan') : ''}</div></div>
    <div class="mut" style="margin:4px 2px 8px">歷屆原卷</div>`;
  DATA.mock.forEach(p => {
    const m = S.mock[p.id];
    h += `<button class="row" data-act="mstart" data-arg="${p.id}"><div class="rt"><b>${p.name}</b>
      <span>限時 ${p.min} 分鐘${m ? ` · 最高 ${m.best} 分 · 做過 ${m.times} 次` : ''}</span></div></button>`;
  });
  return h;
}

function wrongIds(kind) {
  const src = kind === 'fav' ? S.fav : S.wrong;
  return Object.keys(src).filter(id => ITEMS[id] && (kind === 'all' || kind === 'fav' || ITEMS[id].s === kind))
    .sort((a, b) => ORDER[a] - ORDER[b]);
}

function wrongTab() {
  const rows = [['all', '全部錯題'], ['tool', '理財工具錯題'], ['plan', '規劃實務錯題'], ['fav', '★ 收藏題']];
  let h = '<div class="card mut">練習或模擬考答錯的題目會自動收進來；在這裡<b>答對就移出</b>。作答時點右上角 ☆ 可收藏。</div>';
  rows.forEach(([k, v]) => {
    const n = wrongIds(k).length;
    h += `<button class="row" data-act="wstart" data-arg="${k}" ${n ? '' : 'disabled'}><div class="rt"><b>${v}</b><span>${n} 題</span></div></button>`;
  });
  return h;
}

function statsTab() {
  let h = '';
  ['tool', 'plan'].forEach(s => {
    const all = DATA.hot.filter(q => q.s === s);
    const done = all.filter(q => S.rec[q.id]);
    const right = done.filter(q => S.rec[q.id].last).length;
    h += `<div class="card"><b>${SUBJ[s]}（高頻題）</b><div class="mut">做過 ${done.length} / ${all.length} 題；上次答對 ${right} 題${done.length ? `（${Math.round(right / done.length * 100)}%）` : ''}</div>
      <table><tr><th>章節</th><th>做過</th><th>上次答對率</th></tr>`;
    [...new Set(all.map(q => q.ch))].forEach(ch => {
      const L = all.filter(q => q.ch === ch), d = L.filter(q => S.rec[q.id]), r = d.filter(q => S.rec[q.id].last).length;
      h += `<tr><td>${esc(ch)}</td><td>${d.length}/${L.length}</td><td>${d.length ? Math.round(r / d.length * 100) + '%' : '—'}</td></tr>`;
    });
    h += '</table></div>';
  });
  h += '<div class="card"><b>模擬考紀錄</b>';
  h += S.hist.length ? '<table><tr><th>時間</th><th>考卷</th><th>分數</th><th>用時</th></tr>' + S.hist.slice(0, 20).map(x =>
    `<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td class="${x.score >= 70 ? 'pass' : 'fail'}">${x.score}</td><td>${x.used} 分</td></tr>`).join('') + '</table>'
    : '<div class="mut">還沒考過</div>';
  h += '</div><div class="card mut">紀錄存在這台裝置的瀏覽器裡（手機、電腦各自分開）。<br><button data-act="reset">清除所有紀錄</button></div>';
  return h;
}

/* ---------- 題目卡 ---------- */
function qCard(q, a, reveal, label) {
  const meta = label || (q.ch ? `${q.id}　${q.star ? '⭐'.repeat(q.star) + '　' : ''}出現 ${q.n} 屆　${esc(q.ch)}` : q.id);
  let h = `<div class="card"><div class="meta">${meta}</div><div class="stem">${esc(q.stem)}</div><div class="opts">`;
  const shown = reveal && a !== undefined;
  q.opts.forEach((o, k) => {
    const n = k + 1;
    let c = '';
    if (shown) { if (q.ans == null || n === q.ans) c = 'ok'; else if (n === a) c = 'bad'; }
    else if (a === n) c = 'sel';
    h += `<button class="opt ${c}" data-act="pick" data-arg="${n}" ${shown ? 'disabled' : ''}><b>(${n})</b> ${esc(o)}</button>`;
  });
  h += '</div>';
  if (shown) {
    const ok = a !== 0 && isOk(q, a);
    const tag = a === 0 ? '— 未作答' : ok ? '✔ 答對' : '✘ 答錯';
    h += `<div class="exp ${ok ? 'ok' : 'bad'}" id="exp"><div class="res">${tag}　正解 ${q.ans ? `(${q.ans}) ${esc(q.opts[q.ans - 1])}` : '送分題（任何答案都算對）'}</div>
      ${q.exp.map(e => `<p>${esc(e)}</p>`).join('')}${q.refs ? `<p class="refs">歷屆出處：${esc(q.refs)}</p>` : ''}</div>`;
  }
  return h + '</div>';
}

/* ---------- 練習 ---------- */
function startSession(list, title, kind) {
  if (!list.length) { alert('這個條件下沒有題目'); return; }
  if (S.prefs.shuf) list = shuffle([...list]);
  sess = {list, i: 0, ans: {}, title, kind};
  view = 'sess'; showQ(true);
}

function showQ(top) {
  const q = sess.list[sess.i], a = sess.ans[q.id];
  app.innerHTML = `<header class="bar"><button data-act="home">← 返回</button><span>${esc(sess.title)}<br>${sess.i + 1} / ${sess.list.length}</span>
    <button class="fav" data-act="fav">${S.fav[q.id] ? '★' : '☆'}</button></header><main>${qCard(q, a, true)}
    <div class="nav"><button data-act="prev" ${sess.i === 0 ? 'disabled' : ''}>上一題</button>
    <button class="primary" data-act="next">${sess.i === sess.list.length - 1 ? '看結果' : '下一題'}</button></div></main>`;
  if (top) window.scrollTo(0, 0);
  else { const e = document.getElementById('exp'); if (e) e.scrollIntoView({behavior: 'smooth', block: 'nearest'}); }
}

function summary() {
  view = 'summary';
  const L = sess.list, done = L.filter(q => sess.ans[q.id] != null);
  const wrongs = done.filter(q => !isOk(q, sess.ans[q.id]));
  const right = done.length - wrongs.length;
  sess.wrongs = wrongs;
  app.innerHTML = `<header class="bar"><button data-act="home">← 返回</button><span>${esc(sess.title)}</span><span></span></header><main>
    <div class="card center"><div class="big">${right} / ${done.length}</div>
    <p>答對率 ${done.length ? Math.round(right / done.length * 100) : 0}%（共 ${L.length} 題，作答 ${done.length} 題）</p>
    ${wrongs.length ? `<button class="primary" data-act="redo">重做這次答錯的 ${wrongs.length} 題</button>` : ''}
    <button data-act="home">回首頁</button></div></main>`;
  window.scrollTo(0, 0);
}

/* ---------- 模擬考 ---------- */
function showMock() {
  view = 'mock';
  const c = S.cur, p = paperFromCur(c), q = p.items[c.i];
  const n = Object.keys(c.ans).length;
  app.innerHTML = `<header class="bar"><button data-act="home">← 暫離</button><span>⏱ <b id="timer"></b><br>${c.i + 1} / 50（已答 ${n}）</span>
    <button class="primary" data-act="submit">交卷</button></header><main>${qCard(q, c.ans[q.id], false, `${p.name}　第 ${c.i + 1} 題`)}
    <div class="nav"><button data-act="prev" ${c.i === 0 ? 'disabled' : ''}>上一題</button><button data-act="next" ${c.i === 49 ? 'disabled' : ''}>下一題</button></div>
    <div class="card"><div class="mut">題目總覽（藍色＝已作答）</div><div class="grid">${p.items.map((x, k) =>
      `<button class="${c.ans[x.id] ? 'done' : ''} ${k === c.i ? 'cur' : ''}" data-act="mgo" data-arg="${k}">${k + 1}</button>`).join('')}</div></div></main>`;
  tick();
  if (!timerId) timerId = setInterval(tick, 1000);
}

function tick() {
  if (!S.cur) return stopTimer();
  const left = S.cur.end - Date.now();
  if (left <= 0) { stopTimer(); alert('時間到，自動交卷'); submitMock(); return; }
  const el = document.getElementById('timer');
  if (el) el.textContent = fmt(left);
}

function submitMock() {
  stopTimer();
  const c = S.cur, p = paperFromCur(c);
  let right = 0;
  p.items.forEach(q => {
    const a = c.ans[q.id];
    if (a != null) record(q, a, false);
    else if (q.ans != null) S.wrong[q.id] = 1;
    if (a != null ? isOk(q, a) : q.ans == null) right++;
  });
  const score = right * 2;
  const m = S.mock[p.id] || {best: 0, times: 0};
  m.best = Math.max(m.best, score); m.times++;
  S.mock[p.id] = m;
  const used = Math.round((Math.min(Date.now(), c.end) - c.start) / 60000);
  S.hist.unshift({pid: p.id, name: p.name, score, used, date: new Date().toLocaleString('zh-TW', {hour12: false})});
  result = {p, ans: {...c.ans}, score, right, used, i: 0};
  S.cur = null; save();
  showResult();
}

function showResult() {
  view = 'result';
  const r = result;
  app.innerHTML = `<header class="bar"><button data-act="home">← 首頁</button><span>${r.p.name}</span><span></span></header><main>
    <div class="card center"><div class="big">${r.score} 分</div>
    <p class="${r.score >= 70 ? 'pass' : 'fail'}">${r.score >= 70 ? '及格 🎉' : '未達 70 分'}　答對 ${r.right} / 50　用時 ${r.used} 分鐘</p></div>
    <div class="card"><div class="mut">點題號看解析（綠＝對、紅＝錯或未答）</div><div class="grid">${r.p.items.map((q, k) => {
      const a = r.ans[q.id]; const ok = a != null ? isOk(q, a) : q.ans == null;
      return `<button class="${ok ? 'ok' : 'bad'}" data-act="rgo" data-arg="${k}">${k + 1}</button>`; }).join('')}</div>
    <button class="primary" data-act="rwrong" style="margin-top:10px">只看錯題解析</button></div></main>`;
  window.scrollTo(0, 0);
}

function showReview() {
  view = 'review';
  const r = result, list = r.list, q = list[r.i];
  app.innerHTML = `<header class="bar"><button data-act="result">← 成績</button><span>${r.p.name}<br>檢討 ${r.i + 1} / ${list.length}</span><button class="fav" data-act="fav">${S.fav[q.id] ? '★' : '☆'}</button></header>
    <main>${qCard(q, r.ans[q.id] || 0, true)}<div class="nav"><button data-act="prev" ${r.i === 0 ? 'disabled' : ''}>上一題</button>
    <button data-act="next" ${r.i === list.length - 1 ? 'disabled' : ''}>下一題</button></div></main>`;
  window.scrollTo(0, 0);
}

/* ---------- 事件 ---------- */
function curQ() {
  if (view === 'sess') return sess.list[sess.i];
  if (view === 'review') return result.list[result.i];
  if (view === 'mock') return paperFromCur(S.cur).items[S.cur.i];
}

function act(a, arg) {
  switch (a) {
    case 'tab': tab = arg; home(); break;
    case 'home': home(); break;
    case 'subj': S.prefs.s = arg; save(); home(); break;
    case 'start': startSession(hotList(S.prefs.s, arg).filter(q => S.prefs.mode === 'all' ? true :
        S.prefs.mode === 'new' ? !S.rec[q.id] : !S.rec[q.id] || !S.rec[q.id].last), arg || `${SHORT[S.prefs.s]}｜全部章節`, 'hot'); break;
    case 'wstart': startSession(wrongIds(arg).map(id => ITEMS[id]), arg === 'fav' ? '收藏題' : '錯題本', arg === 'fav' ? 'fav' : 'wrong'); break;
    case 'redo': startSession(sess.wrongs, '重做錯題', sess.kind); break;
    case 'fav': { const q = curQ(); if (S.fav[q.id]) delete S.fav[q.id]; else S.fav[q.id] = 1; save();
      view === 'review' ? showReview() : showQ(false); break; }
    case 'pick': {
      const n = +arg;
      if (view === 'sess') { const q = sess.list[sess.i]; if (sess.ans[q.id] != null) return;
        sess.ans[q.id] = n; record(q, n, sess.kind === 'wrong'); save(); showQ(false); }
      else if (view === 'mock') { const q = curQ(); S.cur.ans[q.id] = n; save(); showMock(); }
      break; }
    case 'prev':
      if (view === 'sess' && sess.i > 0) { sess.i--; showQ(true); }
      else if (view === 'mock' && S.cur.i > 0) { S.cur.i--; save(); showMock(); }
      else if (view === 'review' && result.i > 0) { result.i--; showReview(); }
      break;
    case 'next':
      if (view === 'sess') { if (sess.i < sess.list.length - 1) { sess.i++; showQ(true); } else summary(); }
      else if (view === 'mock' && S.cur.i < 49) { S.cur.i++; save(); showMock(); }
      else if (view === 'review' && result.i < result.list.length - 1) { result.i++; showReview(); }
      break;
    case 'mstart': {
      if (S.cur && !confirm('會放棄目前未完成的模擬考，確定開始新的一份？')) return;
      const p = paperOf(arg);
      if (!confirm(`${p.name}\n限時 ${p.min} 分鐘，按確定開始計時。`)) return;
      S.cur = {pid: p.id, ans: {}, i: 0, start: Date.now(), end: Date.now() + p.min * 60000}; save(); showMock(); break; }
    case 'rstart': {
      if (S.cur && !confirm('會放棄目前未完成的模擬考，確定開始新的一份？')) return;
      const min = arg === 'tool' ? 60 : 90, name = `隨機模擬考 ${SUBJ[arg]}`;
      if (!confirm(`${name}\n限時 ${min} 分鐘，按確定開始計時。`)) return;
      S.cur = {pid: `rand-${arg}`, ids: genRandom(arg), name, min, ans: {}, i: 0, start: Date.now(), end: Date.now() + min * 60000};
      save(); showMock(); break; }
    case 'resume': if (S.cur.end <= Date.now()) { alert('時間已到，自動交卷'); submitMock(); } else showMock(); break;
    case 'abandon': if (confirm('確定放棄這份模擬考？作答不會計分。')) { S.cur = null; save(); home(); } break;
    case 'mgo': S.cur.i = +arg; save(); showMock(); break;
    case 'submit': {
      const left = 50 - Object.keys(S.cur.ans).length;
      if (confirm(left ? `還有 ${left} 題沒作答，確定交卷？` : '確定交卷？')) submitMock(); break; }
    case 'result': showResult(); break;
    case 'rgo': result.list = result.p.items; result.i = +arg; showReview(); break;
    case 'rwrong': {
      result.list = result.p.items.filter(q => { const a = result.ans[q.id]; return !(a != null ? isOk(q, a) : q.ans == null); });
      if (!result.list.length) { alert('全對，沒有錯題！'); return; }
      result.i = 0; showReview(); break; }
    case 'reset': if (confirm('確定清除所有作答紀錄、錯題本、收藏與模擬考成績？')) {
      S = {rec: {}, wrong: {}, fav: {}, mock: {}, hist: [], cur: null, prefs: S.prefs}; save(); home(); } break;
  }
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) act(b.dataset.act, b.dataset.arg);
});
app.addEventListener('change', e => {
  const k = e.target.dataset.pref;
  if (!k) return;
  S.prefs[k] = k === 'shuf' ? e.target.checked : k === 'star' ? +e.target.value : e.target.value;
  save(); home();
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (/^[1-4]$/.test(e.key) && (view === 'sess' || view === 'mock')) act('pick', e.key);
  else if (e.key === 'ArrowRight' || (e.key === 'Enter' && view !== 'home')) act('next');
  else if (e.key === 'ArrowLeft') act('prev');
});

home();
</script>
</body>
</html>
